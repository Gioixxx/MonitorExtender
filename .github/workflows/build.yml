name: build

# Verifica che entrambe le metà del progetto compilino e che i test passino.
# Gira su Windows perché il server usa API che esistono solo lì.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compila
        run: dotnet build src/MonitorExtender.Server/MonitorExtender.Server.csproj --configuration Release

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test e pacchetto
        working-directory: android
        # assembleDebug e non bundleRelease: la chiave di firma non sta nel repository,
        # e senza di essa una release non sarebbe comunque pubblicabile.
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Conserva i risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test
          path: android/app/build/reports/tests/
